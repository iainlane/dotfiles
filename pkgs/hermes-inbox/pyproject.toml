[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-inbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agentmail>=2,<3",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=1.2,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["basedpyright", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["hermes_inbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["hermes_inbox", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["hermes_inbox"]
