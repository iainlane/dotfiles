[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "prose-lint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tomli-w"]

[project.scripts]
prose-lint = "prose_lint.cli:main"

[tool.setuptools.packages.find]
include = ["prose_lint*"]

[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"

[tool.basedpyright]
include = ["prose_lint", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff.lint.isort]
known-first-party = ["prose_lint"]
known-third-party = ["pytest", "tomli_w"]
