# For every rule in the Prose style: its tier, its level, whether it can be
# lowered, and which files it applies to. The globs under
# [scopes] are the section headers of vale.ini, so each level computed here
# goes into the section that enables the rule.

[scopes]
all = "*"
commit = "*.txt"
code = "*.{bash,c,cc,cfg,conf,cpp,cs,go,h,hpp,ini,java,js,jsx,lua,nix,php,pl,py,r,rb,rs,scala,sh,swift,toml,ts,tsx,yaml,yml}"
markdown = "*.md"

[rules.ArrowChain]
tier = "portable"
level = "error"
locked = true
scope = "all"

[rules.AbstractAbsence]
tier = "portable"
level = "error"
locked = true
scope = "all"

[rules.ReviewRationale]
tier = "portable"
level = "error"
locked = true
scope = "code"

[rules.EmDash]
tier = "portable"
level = "error"
locked = false
scope = "all"

[rules.Thus]
tier = "portable"
level = "error"
locked = false
scope = "all"

[rules.ServesAs]
tier = "portable"
level = "error"
locked = false
scope = "all"

[rules.TrailingBenefit]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.ZeroRelative]
tier = "portable"
level = "error"
locked = false
scope = "all"

# The same shape with a proper noun as the subject of the clause. A compound
# noun subject (`the Agent Skills format requires`) reads the same way to the
# tagger, so this form only warns.
[rules.ZeroRelativeNamed]
tier = "portable"
level = "warning"
locked = false
scope = "all"

# The same shape with a compound noun as the head. A fronted adverbial (`in
# production mode the server listens`) tags the same way, so this form only
# warns.
[rules.ZeroRelativeBare]
tier = "portable"
level = "warning"
locked = false
scope = "all"

# The same shape starting at the head noun, as in `everything the repository
# declares`. A docstring that opens with an imperative reads the same way to
# the tagger, as in `Hash the exact retained files`, so this form only warns.
[rules.ZeroRelativeShort]
tier = "portable"
level = "warning"
locked = false
scope = "all"

# The same shape with a pronoun as the subject of the clause, as in `the
# features it includes`. The rule lists the pronouns that can be a subject,
# because a reflexive such as `the policy itself is` reads the same way. A
# question-word clause (`decides whose repository it is`) and a verb's object
# (`means it does`) also read the same way, so this form only warns.
[rules.ZeroRelativePronoun]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.RepeatedWords]
tier = "portable"
level = "error"
locked = false
scope = "all"

[rules.SpellingConsistency]
tier = "portable"
level = "error"
locked = false
scope = "all"

# Some projects require Signed-off-by, so this rule's list of rejected
# trailers does not suit every project. Keeping it unlocked lets a
# project that needs a trailer lower the rule.
[rules.Trailers]
tier = "house"
level = "error"
locked = false
scope = "commit"

[rules.WarningVerbs]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.WarningVerbGerunds]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.WarningVerbPhrases]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.StockWords]
tier = "portable"
level = "warning"
locked = false
scope = "all"

# Vale cannot tell whether the alternative is real, and across this repository
# nearly every match turned out to be a real alternative, so the rule only
# suggests.
[rules.InventedAlternative]
tier = "portable"
level = "suggestion"
locked = false
scope = "all"

[rules.ManneredPhrases]
tier = "portable"
level = "warning"
locked = false
scope = "all"

[rules.TheOneX]
tier = "portable"
level = "suggestion"
locked = false
scope = "all"

[rules.Chronology]
tier = "portable"
level = "warning"
locked = false
scope = "commit"

[rules.DiffWalkthrough]
tier = "portable"
level = "warning"
locked = false
scope = "commit"

[rules.PrTalk]
tier = "portable"
level = "warning"
locked = false
scope = "commit"

[rules.BoldLabelBullets]
tier = "portable"
level = "warning"
locked = false
scope = "markdown"

[rules.BritishSpelling]
tier = "house"
level = "warning"
locked = false
scope = "all"

[rules.AmericanSpelling]
tier = "house"
level = "warning"
locked = false
scope = "all"

[rules.Latin]
tier = "house"
level = "warning"
locked = false
scope = "all"

[rules.Please]
tier = "house"
level = "warning"
locked = false
scope = "all"

[rules.Exclamation]
tier = "house"
level = "warning"
locked = false
scope = "all"
