extends: existence
message:
  "'%s' introduces an alternative. Does the reader need this comparison? If the
  explanation is complete without it, state the behaviour directly."
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '\brather than\b'
  - '\binstead of\b'
  - '\bnot just\b'
  - "\\bit'?s not \\w+, it'?s\\b"
  - '\bnot only\b[^.]{0,60}\bbut\b'
