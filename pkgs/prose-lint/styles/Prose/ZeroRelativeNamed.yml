extends: sequence
model: Lexicon
message:
  "A noun followed by a name and a verb reads as a clause squeezed into a noun
  phrase. State the relationship as a plain clause, a prepositional phrase or
  its own sentence."
level: warning
tokens:
  # Anchored so that DT does not also match a pronoun's WDT; see
  # ZeroRelative.yml.
  - tag: ^DT$
  - tag: NN|NNS|NNP
  - tag: NNP
  - tag: NN|NNS|NNP|JJ
  - tag: VBZ|VBD|VBP|NNS|MD
