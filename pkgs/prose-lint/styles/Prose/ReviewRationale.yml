extends: existence
message:
  "Remove patch history from the comment. Describe the current constraint and
  put the reason for the change in the commit message."
level: error
nonword: true
ignorecase: true
tokens:
  - '\bPreviously\b(?=,?\s+(?:the|a|an|this|that|these|those|it|we|they|he|she)\b)'
  - '(?<=\b(?:it|we|they|this|that)\s)used to\b'
  - '\b(?:This fix|This fixes|Before this change|Was broken)\b'
