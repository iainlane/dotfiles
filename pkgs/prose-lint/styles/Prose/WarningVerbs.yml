extends: sequence
model: Lexicon
message:
  "Replace '%s' with the verb for the actual relationship: 'contains' for data,
  'specifies' for configuration, or 'owns' for a lock."
level: warning
ignorecase: true
tokens:
  - pattern: holds?|carry|carries|names?|settles?|sits?
    tag: VB|VBZ|VBP|VBD|VBG
