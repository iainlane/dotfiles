extends: sequence
model: Lexicon
message:
  "This noun phrase has a clause squeezed inside it, so the relationship between
  the two nouns is left for the reader to reconstruct. State the relationship as
  a plain clause, a prepositional phrase or its own sentence."
level: error
tokens:
  # Vale does not anchor a tag pattern, so a bare DT also matches the WDT of
  # a relative or interrogative pronoun: the rule would fire on a clause with
  # its pronoun in place, and on a subject clause such as `which secrets a
  # machine needs`.
  - tag: ^DT$
  - tag: NN|NNS|NNP
  - tag: ^(?:DT|PRP\$)$
  - tag: NN|NNS|NNP|JJ
  - tag: VBZ|VBD|VBP|NNS|MD
