extends: sequence
model: House
message:
  "An object-relative clause without 'that' or 'which' compresses a relationship
  into a noun phrase. Rewrite it as a prepositional phrase or its own sentence;
  add the pronoun only when the clause does nothing but identify the noun."
level: error
tokens:
  - tag: DT
  - tag: NN|NNS|NNP
  # Vale does not anchor a tag pattern, so a bare DT also matches the WDT of
  # a relative pronoun and the rule would fire on a clause with its pronoun in
  # place.
  - tag: ^(?:DT|PRP\$)$
  - tag: NN|NNS|NNP|JJ
  - tag: VBZ|VBD|VBP|NNS
