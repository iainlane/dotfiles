extends: sequence
model: Lexicon
message:
  "Replace '%s' with the verb for the actual relationship: 'contains' for data,
  'specifies' for configuration, or 'owns' for a lock."
level: warning
ignorecase: true
tokens:
  - pattern: holding|carrying|naming|settling|sitting
    tag: VBG
  - tag: DT|PRP\$|CD
