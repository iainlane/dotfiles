extends: sequence
model: Lexicon
message:
  "A noun followed by a possessive subject and a verb reads as a clause squeezed
  into a noun phrase. State the relationship as a plain clause, a prepositional
  phrase or its own sentence."
level: warning
tokens:
  # Anchored so that each tag does not also match a longer sibling; see
  # ZeroRelative.yml. A possessive with no adjective, `the version Pi's
  # installer would resolve`, is left out: over this repository that shape
  # matched only possessive subjects with their own main verb.
  - tag: ^DT$
  - tag: ^(?:NN|NNS|NNP)$
  - tag: ^(?:NN|NNP)$
  - tag: ^POS$
  - tag: ^JJ$
  - tag: ^(?:NN|NNS)$
  - tag: ^(?:VBZ|VBD|VBP|NNS|MD)$
