extends: sequence
model: Lexicon
message:
  "A compound noun followed by a determiner, a noun and a verb reads as a clause
  squeezed into a noun phrase. State the relationship as a plain clause, a
  prepositional phrase or its own sentence."
level: warning
tokens:
  - tag: NN|NNS
  - tag: NN|NNS
  # Anchored so that DT does not also match a relative pronoun's WDT; see
  # ZeroRelative.yml.
  - tag: ^(?:DT|PRP\$)$
  - tag: NN|NNS|NNP|JJ
  - tag: VBZ|VBD|VBP|NNS|MD
