extends: sequence
model: Lexicon
message:
  "A noun followed by a determiner, a noun and a verb may be an object-relative
  clause without 'that' or 'which'. Such a clause compresses a relationship into
  a noun phrase: rewrite it as a prepositional phrase or its own sentence, and
  add the pronoun only when the clause does nothing but identify the noun."
level: warning
tokens:
  # Anchored so that each tag does not also match a longer sibling; see
  # ZeroRelative.yml. The head must be a common noun: allowing NNP was
  # measured at eight matches in this repository and all eight were sentence
  # openings such as "How a run captures".
  - tag: ^(?:NN|NNS)$
  - tag: ^(?:DT|PRP\$)$
  - tag: ^(?:NN|NNS|NNP|JJ)$
  - tag: ^(?:VBZ|VBD|VBP)$
