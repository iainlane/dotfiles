extends: sequence
model: Lexicon
message:
  "A noun followed by a determiner, a noun and a verb reads as a clause squeezed
  into a noun phrase. State the relationship as a plain clause, a prepositional
  phrase or its own sentence."
level: warning
tokens:
  # Anchored so that each tag does not also match a longer sibling; see
  # ZeroRelative.yml. The head has to be a common noun. With NNP allowed the
  # rule also matches a sentence opening such as "How a run captures".
  - tag: ^(?:NN|NNS)$
  - tag: ^(?:DT|PRP\$)$
  - tag: ^(?:NN|NNS|NNP|JJ)$
  - tag: ^(?:VBZ|VBD|VBP|MD)$
