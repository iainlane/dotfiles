extends: sequence
model: Lexicon
message:
  "A noun followed by a pronoun and a verb may be an object-relative clause
  without 'that' or 'which'. Such a clause compresses a relationship into a noun
  phrase: rewrite it as a prepositional phrase or its own sentence, and add
  'that' or 'which' only when the clause does nothing but identify the noun."
level: warning
tokens:
  # Anchored so that each tag does not also match a longer sibling; see
  # ZeroRelative.yml. A reflexive pronoun takes the same PRP tag, so the
  # pronouns that can be a subject are listed here. Vale already puts word
  # boundaries around a token pattern, and adding `^` and `$` to one makes it
  # match nothing.
  - tag: ^(?:NN|NNS)$
  - pattern: (?:it|they|we|you|he|she)
    tag: ^PRP$
  - tag: ^(?:VBZ|VBD|VBP|MD)$
