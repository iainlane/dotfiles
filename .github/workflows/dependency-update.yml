# Relock flake inputs, refresh their dependents and then bump local packages
# on the same checkout. The update runner stages the accepted changes as one
# candidate. The Tuesday run also maintains dependency lockfiles.
#
# A PR opened with the default `GITHUB_TOKEN` needs a maintainer's approval
# to start CI. A `FLAKE_UPDATE_TOKEN` secret lets the PR start CI automatically.
name: dependency update

on:
  schedule:
    - cron: "0 5 * * 0,1,3,4,5,6" # 05:00 UTC, except Tuesday
    - cron: "0 5 * * 2" # Tuesdays, 05:00 UTC, with lockfile maintenance
  workflow_dispatch:
    inputs:
      maintain-lockfiles:
        description:
          Also run lock-file maintenance for the pnpm packages and Pi extensions
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    name: Update inputs and packages
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # push the dependency-update branch with the bumps
      pull-requests: write # open the candidate and retire the previous one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Trust the binary caches used by the hosts and the cupboard workflow, so
      # anything that these steps have to realise can be substituted.
      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#.nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # The `secrets` input lives in the private dotfiles-secrets repo, reachable
      # only over SSH. Configure the read-only deploy key, the same one that the
      # Cupboard uses, so evaluating and relocking the flake can read it.
      - name: Set up secrets access
        env:
          DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          key="${RUNNER_TEMP}/secrets_deploy_key"
          install -m 600 /dev/null "${key}"
          printf '%s\n' "${DEPLOY_KEY}" > "${key}"
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" >> "${GITHUB_ENV}"

      - name: Build the flake lock summariser
        run: |
          set -euo pipefail
          nix build .#flake-lock-summary --out-link "${RUNNER_TEMP}/flake-lock-summary"

      - name: Run transactional dependency updates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAIN_LOCKFILES:
            ${{ github.event.schedule == '0 5 * * 2' ||
            inputs.maintain-lockfiles }}
        run: |
          set -euo pipefail
          nix build .#update-runner --out-link "${RUNNER_TEMP}/update-runner"
          runner="${RUNNER_TEMP}/update-runner/bin/update-runner"
          report="${RUNNER_TEMP}/update-report.md"
          arguments=(combined --stage)
          if [[ "${MAINTAIN_LOCKFILES:-}" == true ]]; then
            arguments+=(--maintain-lockfiles)
          fi
          if ! "${runner}" "${arguments[@]}" > "${report}"; then
            echo "::warning::Some updates were skipped; see the update report."
          fi
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the update pull request
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
        run: exec bash scripts/publish-update-pr.bash
