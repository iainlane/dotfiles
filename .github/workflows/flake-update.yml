# Relock the flake inputs on a schedule, and on demand, then open a pull
# request with the result. Merging that PR is what puts fresh builds in the
# cupboard cache: the push to main triggers the `cupboard` workflow, which
# rebuilds the updated closure and publishes it to the default cache.
#
# A PR opened with the default `GITHUB_TOKEN` does not trigger other workflows.
# Instead, it presents an approval button so a maintainer can start them. Set a
# `FLAKE_UPDATE_TOKEN` secret (a PAT or GitHub App token) to have the PR trigger
# CI like any other.
name: flake update

on:
  schedule:
    - cron: "0 5 * * *" # Daily, 05:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    name: Relock flake inputs and open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the flake-update branch with the relocked inputs
      pull-requests: write # close any earlier flake-update PR and open a new one
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Trust the same binary caches the hosts and the cupboard workflow do,
      # so anything these steps have to realise can be substituted.
      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # The `secrets` input lives in the private dotfiles-secrets repo, reachable
      # only over SSH. Configure the read-only deploy key so `nix flake update`
      # can relock it, the same key the cupboard workflow uses to build the host
      # and home closures.
      - name: Set up secrets access
        env:
          DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          key="${RUNNER_TEMP}/secrets_deploy_key"
          install -m 600 /dev/null "${key}"
          printf '%s\n' "${DEPLOY_KEY}" > "${key}"
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" >> "${GITHUB_ENV}"

      - name: Relock flake inputs
        run: |
          set -euo pipefail
          nix flake update

      - name: Open a pull request for the relocked inputs
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Flake inputs already current; nothing to propose."
            exit 0
          fi

          gh auth setup-git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          summary="$(./scripts/flake-lock-summary.bash <(git show HEAD:flake.lock) flake.lock)"

          # A fresh branch per run, so a rerun opens its own PR even when an
          # earlier one is still open or already merged.
          branch="flake-update/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"

          # Keep a single relock in flight: close any earlier flake-update PRs and
          # delete their branches, then sweep up any branches left without a PR.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("flake-update/")) | .number' \
            | while read -r number; do
                gh pr close "${number}" --delete-branch
              done

          git ls-remote --heads origin "refs/heads/flake-update/*" \
            | sed 's#.*refs/heads/##' \
            | while read -r stale; do
                git push origin --delete "${stale}"
              done

          git switch -C "${branch}"
          git commit -am "chore(flake): update inputs"
          git push origin "HEAD:refs/heads/${branch}"

          body="$(printf '%s\n' \
            "Automated relock of the flake inputs from the scheduled \`flake-update\` workflow (\`nix flake update\`)." \
            "" \
            "Updated inputs:" \
            "" \
            "${summary}" \
            "" \
            "Merging this publishes the rebuilt closure to the cupboard cache through the \`cupboard\` workflow's push-to-main build.")"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(flake): update inputs" \
            --label dependencies \
            --body "${body}"
