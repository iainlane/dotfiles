# Relock the flake inputs on a schedule, and on demand, then open a pull
# request with the result. Merging that PR is what puts fresh builds in the
# cupboard cache: the push to main triggers the `cupboard` workflow, which
# builds the requested deploy-profile outputs and publishes selected outputs
# and intermediates built during that run to the default cache.
#
# A PR opened with the default `GITHUB_TOKEN` does not trigger other workflows.
# Instead, it presents an approval button so a maintainer can start them. Set a
# `FLAKE_UPDATE_TOKEN` secret (a PAT or GitHub App token) to have the PR trigger
# CI like any other.
name: flake update

on:
  schedule:
    - cron: "0 5 * * *" # Daily, 05:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    name: Relock flake inputs and open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the flake-update branch with the relocked inputs
      pull-requests: write # close any earlier flake-update PR and open a new one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Trust the binary caches used by the hosts and the cupboard workflow, so
      # anything that these steps have to realise can be substituted.
      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#.nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # The `secrets` input lives in the private dotfiles-secrets repo, reachable
      # only over SSH. Configure the read-only deploy key so `nix flake update`
      # can relock it, the same key the cupboard workflow uses to build the host
      # and home closures.
      - name: Set up secrets access
        env:
          DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          key="${RUNNER_TEMP}/secrets_deploy_key"
          install -m 600 /dev/null "${key}"
          printf '%s\n' "${DEPLOY_KEY}" > "${key}"
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" >> "${GITHUB_ENV}"

      - name: Build the flake lock summariser
        run: |
          set -euo pipefail
          nix build .#flake-lock-summary --out-link "${RUNNER_TEMP}/flake-lock-summary"

      - name: Run transactional input updates and refreshes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nix build .#update-runner --out-link "${RUNNER_TEMP}/update-runner"
          runner="${RUNNER_TEMP}/update-runner/bin/update-runner"
          report="${RUNNER_TEMP}/update-report.md"
          if ! "${runner}" inputs --stage > "${report}"; then
            echo "::warning::Some updates were skipped; see the update report."
          fi
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the update pull request
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
        run: exec bash scripts/publish-update-pr.bash flake-update
