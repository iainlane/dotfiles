# Publish build outputs to the personal cupboard cache. Pushes to main publish
# to the default cache with permanent retention; pull requests publish to a
# short-lived per-PR cache so changes can be tested without touching the default
# cache. The local reusable workflow carries the repository-specific builder
# configuration and delegates the work to cupboard's released flake-publish
# workflow, whose `job_workflow_ref` the laney tenant trusts.
#
# The deploy key is passed on pull requests too, so the host and home closures
# build there as well. GitHub withholds secrets from fork pull requests, so a
# fork build receives an empty key and skips those closures; only same-repo
# branches (own pushes and the flake-update PR) carry it.
#
# The closure builds in the publish path are best-effort, so they cannot gate a
# merge. Two jobs are the strict gate. `configuration-validation` builds the
# checks that need no secrets, then evaluates every NixOS, nix-darwin,
# system-manager and standalone Home Manager configuration without building the
# resulting host closures. `packages` builds everything under `pkgs/` that the
# runner can build.
name: cupboard

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: cupboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  configuration-validation:
    name: Validate configurations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Trust the same binary caches the hosts use, as in the publish path.
      # Some home configurations import from derivation while evaluating, so
      # Nix has to realise those outputs during evaluation. With the caches
      # trusted, Nix substitutes the outputs they already have instead of
      # building them.
      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # The `host-evaluation-*` and `deploy-*` checks evaluate host
      # configurations, which reads the private secrets input. Exclude them
      # here so a fork pull request can build the rest without a deploy key.
      - name: Build the checks
        run: |
          set -euo pipefail

          mapfile -t names < <(
            nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
              jq --raw-output '.[] | select((startswith("host-evaluation-") or startswith("deploy-")) | not)'
          )

          nix build "${names[@]/#/.#checks.x86_64-linux.}"

      # Evaluating the host and home configurations reads the private secrets
      # input, so the host-evaluation checks need the deploy key. Fork pull
      # requests do not receive it and skip those checks, as they skip the
      # closure builds in the publish path.
      - name: Set up secrets access
        id: secrets
        env:
          DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_KEY}" ]; then
            echo "No secrets deploy key; skipping the host evaluations."
            echo "have_key=false" | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          key="${RUNNER_TEMP}/secrets_deploy_key"
          install -m 600 /dev/null "${key}"

          printf '%s\n' "${DEPLOY_KEY}" > "${key}"
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" | tee -a "${GITHUB_ENV}"
          echo "have_key=true" | tee -a "${GITHUB_OUTPUT}"

      # The host evaluations import from derivation, so Nix realises those
      # derivations mid-evaluation. nixbuild.net supplies them, as a
      # substituter and as a remote builder for the ones it has to build.
      - uses: nixbuild/nixbuild-action@edba7779b0a251b622d4250d263540f50c0f1a0b # v25
        if: ${{ steps.secrets.outputs.have_key == 'true' }}
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_NET_SECRET }}

      # The host-evaluation checks in `flake/parts/checks/host-evaluation.nix`
      # force the toplevel derivation of every host configuration. Forcing the
      # derivation path of every check, on every system, therefore evaluates
      # every host without building any of them.
      #
      # Do not use `nix flake check --no-build` here. That flag puts Nix into
      # read-only mode, where a filtered source gets a store path that Nix
      # computes but never writes, and evaluation fails as soon as it needs
      # that path. Without the flag, `nix flake check` builds every check for
      # this runner's system, which is more than this job is for.
      - name: Evaluate the host configurations
        if: ${{ steps.secrets.outputs.have_key == 'true' }}
        run: |
          set -euo pipefail

          ./scripts/nix-retry.bash eval --raw .#checks --apply \
            'checks:
              builtins.deepSeq
                (builtins.mapAttrs
                  (_: builtins.mapAttrs (_: check: check.drvPath))
                  checks)
                "ok"'

  packages:
    name: Build the packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # `local-packages` covers every package under `pkgs/` that this runner
      # can build.
      - name: Build the packages
        run: |
          set -euo pipefail

          nix build --no-link --print-out-paths .#local-packages

  publish:
    permissions:
      attestations: write # write build provenance attestations for the outputs
      contents: read
      id-token: write # issue the OIDC token the cupboard cache trusts for push
    # Keep the repository-specific inputs on main; the jobs themselves come
    # from cupboard's separately trusted released workflow.
    uses: iainlane/dotfiles/.github/workflows/cupboard-publish.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_NET_SECRET }}
      secrets_deploy_key: ${{ secrets.SECRETS_DEPLOY_KEY }}
