name: Cupboard publication validation on

on:
  push:
    branches: [codex/publication-validation-on-20261009]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  group: cupboard-publication-validation-on-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.id == github.repository_id &&
      (github.event.action == 'closed' || !github.event.pull_request.draft))
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    uses: $/.github/workflows/cupboard-publish.yml
    with:
      targets: .#cupboardValidationOriginal
    secrets:
      falcon_cache_password: ${{ secrets.FALCON_CACHE_PASSWORD }}
      nixbuild_token: ${{ secrets.NIXBUILD_NET_SECRET }}
      secrets_deploy_key: ${{ secrets.SECRETS_DEPLOY_KEY }}
