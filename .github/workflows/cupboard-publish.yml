name: cupboard publish

on:
  workflow_call:
    inputs:
      push:
        description:
          Attest and publish the results. When false, each target is only built.
        type: boolean
        default: true
        required: false
    secrets:
      falcon_cache_password:
        description: Read-only password for the private Falcon binary cache.
        required: false
      nixbuild_token:
        description: nixbuild.net token used to realise derivations remotely.
        required: true
      secrets_deploy_key:
        description:
          Read-only deploy key for the private dotfiles-secrets input.
        required: false

permissions: {}

jobs:
  sources:
    name: Evaluate publish inputs

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      trustedPublicKey: ${{ steps.publish-inputs.outputs.trustedPublicKey }}
      githubKnownHost: ${{ steps.publish-inputs.outputs.githubKnownHost }}
      builders: ${{ steps.publish-inputs.outputs.builders }}
      builderKnownHosts: ${{ steps.publish-inputs.outputs.builderKnownHosts }}
      remoteSubstituters: ${{ steps.publish-inputs.outputs.remoteSubstituters }}
      remoteTrustedKeys: ${{ steps.publish-inputs.outputs.remoteTrustedKeys }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - id: publish-inputs
        name: Evaluate the publish inputs
        run: |
          set -euo pipefail

          nix eval --json .#nix.publishInputs \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' \
            | tee -a "${GITHUB_OUTPUT}"

  publish:
    needs: sources
    permissions:
      attestations: write # write build provenance attestations for the outputs
      contents: read
      id-token: write # issue the OIDC token the cupboard cache trusts for push

    # cupboard's trust policy requires the `job_workflow_ref` to end in a
    # `v*` tag, so this reference cannot be pinned to a commit SHA.
    uses: underwhelmingperformance/cupboard/.github/workflows/cupboard-flake-publish.yml@v0.0.34 # zizmor: ignore[unpinned-uses]
    with:
      url: https://cupboard.supply/t/laney
      targets: .#cupboardOutputs
      preset: pull-request-and-branch
      reuse-view: pull-requests
      maximise-space: true
      nix-config: .#nix.substituterConfig
      trusted-public-key: ${{ needs.sources.outputs.trustedPublicKey }}
      input-known-hosts: >-
        ${{ needs.sources.outputs.githubKnownHost }}
      builders: >-
        ${{ needs.sources.outputs.builders }}
      builder-known-hosts: >-
        ${{ needs.sources.outputs.builderKnownHosts }}
      push: >-
        ${{ inputs.push &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
        }}

    secrets:
      # nixbuild.net authenticates with a token sent in the SSH connection
      # environment.
      #
      # OpenSSH uses the first SetEnv directive from a matching block, so all
      # three assignments must stay on one line.
      builder_ssh_config: |
        Host eu.nixbuild.net
          User authtoken
          PreferredAuthentications none
          ServerAliveInterval 60
          IPQoS throughput
          SetEnv NIXBUILDNET_TOKEN=${{ secrets.nixbuild_token }} NIXBUILDNET_SUBSTITUTERS=${{ needs.sources.outputs.remoteSubstituters }},https://cupboard:${{ secrets.falcon_cache_password }}@cupboard.supply/t/laney/cache/falcon,https://cupboard.supply/t/laney/reuse/pull-requests NIXBUILDNET_TRUSTED_PUBLIC_KEYS=${{ needs.sources.outputs.remoteTrustedKeys }}
      input_ssh_key: ${{ secrets.secrets_deploy_key }}
