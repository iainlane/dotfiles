name: cupboard whole-manifest experiment

on:
  push:
    branches: [experiment/cupboard-whole-manifest]
  workflow_dispatch:

concurrency:
  group: cupboard-whole-manifest-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  sources:
    name: Read evaluation settings
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      trusted-key: ${{ steps.inputs.outputs.trustedPublicKey }}
      known-hosts: ${{ steps.inputs.outputs.githubKnownHost }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 36b847f09d8912068f797abacdfbf0c379deae64
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7
      - id: inputs
        name: Read public evaluation settings
        run: |
          set -euo pipefail
          ./scripts/check-evaluation.bash --json .#nix.publishInputs |
            jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: sources
    name: Evaluate ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read # verify the cupboard release
    strategy:
      fail-fast: false
      matrix:
        include:
          - trial: whole-1
            whole: "true"
          - trial: whole-2
            whole: "true"
          - trial: indexed-four
            whole: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 36b847f09d8912068f797abacdfbf0c379deae64
          persist-credentials: false
      - uses: underwhelmingperformance/cupboard/actions/prepare@97accbbbff334125c544990b5c735291ff25e629 # v0.0.46
        with:
          ssh-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
          input-known-hosts: ${{ needs.sources.outputs.known-hosts }}
          nix-config: .#nix.publishCiConfig
      - uses: underwhelmingperformance/cupboard/actions/setup@97accbbbff334125c544990b5c735291ff25e629 # v0.0.46
        id: setup
        with:
          cache-url: https://cupboard.supply/t/laney
          cupboard-version: v0.0.46
          trusted-public-key: ${{ needs.sources.outputs.trusted-key }}
          private-substituters: >-
            https://cupboard:${{ secrets.FALCON_CACHE_PASSWORD
            }}@cupboard.supply/t/laney/cache/falcon
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: underwhelmingperformance/cupboard
          ref: 2c264661b60821f31c6a22398fc1915b615dd9db
          path: .cupboard-evaluator
          persist-credentials: false
      - name: Evaluate the fixed manifest
        id: evaluation
        env:
          INPUT_TARGETS: .#cupboardOutputs
          INPUT_PUBLISH: outputs
          INPUT_CONCURRENCY: "4"
          INPUT_WHOLE-MANIFEST: ${{ matrix.whole }}
          INPUT_CUPBOARD-PATH: ${{ steps.setup.outputs.cupboard-path }}
          INPUT_READ-SESSION-TARGET:
            ${{ steps.setup.outputs.read-session-target }}
          INPUT_AUDIENCE: ${{ steps.setup.outputs.read-session-audience }}
          INPUT_READ-SESSION-CACHES:
            ${{ steps.setup.outputs.read-session-caches }}
          INPUT_READ-SESSION-VIEW: ${{ steps.setup.outputs.read-session-view }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/evaluation-results"
          export RUNNER_DEBUG=1
          nix --version > "${RUNNER_TEMP}/evaluation-results/nix-version.txt"
          /usr/bin/time --verbose --output="${RUNNER_TEMP}/evaluation-results/time.txt" \
            node .cupboard-evaluator/actions/evaluate-targets/dist/main.cjs \
            2> >(tee "${RUNNER_TEMP}/evaluation-results/stderr.log" >&2)
      - name: Save the evaluated manifest
        env:
          MANIFEST: ${{ steps.evaluation.outputs.manifest }}
          TRIAL: ${{ matrix.trial }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evaluation-results'
          manifest = json.loads(os.environ['MANIFEST'])
          canonical = json.dumps(manifest, sort_keys=True, separators=(',', ':'))
          (root / 'manifest.json').write_text(canonical + '\n')
          summary = {'trial': os.environ['TRIAL'], 'targets': len(manifest), 'sha256': hashlib.sha256(canonical.encode()).hexdigest(), 'dotfiles': '36b847f09d8912068f797abacdfbf0c379deae64'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: evaluation-${{ matrix.trial }}
          path: ${{ runner.temp }}/evaluation-results

  compare:
    name: Compare evaluated manifests
    needs: evaluate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # download the experiment artifacts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evaluation-*
          path: results
      - name: Compare complete target manifests
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('results')
          summaries = [json.loads(path.read_text()) for path in sorted(root.glob('*/summary.json'))]
          assert len(summaries) == 3, summaries
          manifests = [json.loads(path.read_text()) for path in sorted(root.glob('*/manifest.json'))]
          assert len(manifests) == 3
          assert all(manifest == manifests[0] for manifest in manifests)
          assert len(manifests[0]) == 211
          print(json.dumps({'identical': True, 'summaries': summaries}, indent=2))
          PY
