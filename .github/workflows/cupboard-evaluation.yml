name: cupboard evaluation batch experiment

on:
  push:
    branches: [experiment/cupboard-evaluation]
  workflow_dispatch:

permissions: {}

jobs:
  evaluation:
    name: Evaluation batch size ${{ matrix.batch-size }}
    strategy:
      fail-fast: false
      matrix:
        batch-size: [1, 8]
    permissions:
      attestations: write # required by the nested workflow, including evaluation-only runs
      contents: read
      id-token: write # required by the nested workflow's permission declaration
      pull-requests: read # resolve the merged pull request in the trusted wrapper
    uses: iainlane/dotfiles/.github/workflows/cupboard-publish.yml@experiment/cupboard-evaluation # zizmor: ignore[unpinned-uses]
    with:
      evaluation-only: true
      evaluation-concurrency: "1"
      evaluation-batch-size: ${{ matrix.batch-size }}
    secrets:
      falcon_cache_password: ${{ secrets.FALCON_CACHE_PASSWORD }}
      nixbuild_token: ${{ secrets.NIXBUILD_NET_SECRET }}
      secrets_deploy_key: ${{ secrets.SECRETS_DEPLOY_KEY }}
