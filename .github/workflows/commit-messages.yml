name: commit messages

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: commit-messages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint commit messages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Renovate updates this pin. `pkgs/wrapscallion/sources.json` pins the
      # same release for the pre-commit hook. When merging a Renovate update,
      # also run `nix run .#update-wrapscallion` so the hook and this job use
      # the same version.
      - uses: underwhelmingperformance/wrapscallion@84a29c83de42c3dbb294ede1205e6ad54c3de757 # v0.2.2
