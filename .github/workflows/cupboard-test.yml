# Validate changes to the cupboard publish workflow on the pull request that
# makes them. The main `cupboard` workflow pins the local wrapper to @main, so a
# PR editing it never runs the edited version; this one calls the branch's own
# copy by local path, which a pull_request event resolves to the PR head.
#
# The run builds every output but does not inspect or write the cache. Pushing
# on the PR stays with the `cupboard` workflow, through the main branch's
# destination inputs and cupboard's released workflow.
name: cupboard test

on:
  pull_request:
    paths:
      - .github/workflows/cupboard-publish.yml
      - .github/workflows/cupboard-test.yml

concurrency:
  group: cupboard-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish-local:
    # The shared workflow statically requests the write scopes. Build-only mode
    # leaves both unused.
    permissions:
      attestations: write # required by the called workflow; unused without push
      contents: read
      id-token: write # required by the called workflow; unused without push
    uses: ./.github/workflows/cupboard-publish.yml
    with:
      push: false
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_NET_SECRET }}
      secrets_deploy_key: ${{ secrets.SECRETS_DEPLOY_KEY }}
