# Bump the locally packaged tools and the selected flake inputs, gathering
# every bump from one run into a single pull request. Each updater is
# `nix run .#update-<name>`, defined in `pkgs/build-support/updaters.nix` and
# exported by `flake/updaters/outputs.nix`. The updaters run in the order that
# `update-plan order` prints. The Tuesday run also passes `--maintain-lockfiles`,
# so the updaters of the pnpm packages and the Pi extensions move every locked
# dependency to the newest version that its range allows.
#
# `flake-update.yml` handles the mutable inputs that `nix flake update` can move
# on its own; this workflow updates the `pkgs/` packages, release-tag inputs
# and the Hermes integration branch.
#
# As with `flake-update.yml`, a PR opened with the default `GITHUB_TOKEN` does
# not trigger other workflows. Set a `FLAKE_UPDATE_TOKEN` secret to have the PR
# run CI like any other.
name: package update

on:
  schedule:
    - cron: "20 4 * * 2" # Tuesdays, 04:20 UTC
    - cron: "20 4 * * 4" # Thursdays, 04:20 UTC
  workflow_dispatch:
    inputs:
      maintain-lockfiles:
        description:
          Also run lock-file maintenance for the pnpm packages and Pi extensions
        type: boolean
        default: false

permissions: {}

concurrency:
  group: package-update
  cancel-in-progress: true

jobs:
  update:
    name: Update packages
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # push the package-update branch with the bumps
      pull-requests: write # open or refresh the package-update pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Trust the binary caches used by the hosts and the cupboard workflow, so
      # anything that these steps have to realise can be substituted.
      - name: Trust our binary caches
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/nix"
          {
            printf '\n'
            nix eval --raw .#.nix.substituterConfig
          } >> "${HOME}/.config/nix/nix.conf"

      # The `secrets` input lives in the private dotfiles-secrets repo, reachable
      # only over SSH. Configure the read-only deploy key, the same one that the
      # cupboard and flake-update workflows use, so evaluating the flake (and any
      # re-lock by an updater) can read it.
      - name: Set up secrets access
        env:
          DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          key="${RUNNER_TEMP}/secrets_deploy_key"
          install -m 600 /dev/null "${key}"
          printf '%s\n' "${DEPLOY_KEY}" > "${key}"
          echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" >> "${GITHUB_ENV}"

      - name: Run transactional package updates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAIN_LOCKFILES:
            ${{ github.event.schedule == '20 4 * * 2' ||
            inputs.maintain-lockfiles }}
        run: |
          set -euo pipefail
          nix build .#update-runner --out-link "${RUNNER_TEMP}/update-runner"
          runner="${RUNNER_TEMP}/update-runner/bin/update-runner"
          report="${RUNNER_TEMP}/update-report.md"
          arguments=(packages --stage)
          if [[ "${MAINTAIN_LOCKFILES:-}" == true ]]; then
            arguments+=(--maintain-lockfiles)
          fi
          if ! "${runner}" "${arguments[@]}" > "${report}"; then
            echo "::warning::Some updates were skipped; see the update report."
          fi
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the update pull request
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
        run: exec bash scripts/publish-update-pr.bash package-update
